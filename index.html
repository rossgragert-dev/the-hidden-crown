<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Hidden Crown</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#f4e9c8;font-family:"Courier New",ui-monospace,monospace;overflow:hidden;touch-action:none}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;background:#111}
/* Keep rapid gameplay taps from becoming Safari double-tap zoom. 
   Menus retain vertical scrolling; touch combat controls never request browser gestures. */
button{font-family:inherit;touch-action:manipulation;-webkit-touch-callout:none}
#cv,#hud,#ctl,#panel,#title{touch-action:none}
#modal{touch-action:pan-y}
#modal button{touch-action:manipulation}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 10px 0;pointer-events:none;font-weight:bold;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;z-index:4}
.bars{width:132px}
.lv{font-size:12px;margin-bottom:3px;color:#ffd34a}
.bar{height:9px;background:rgba(0,0,0,.65);border:1px solid #000;margin-bottom:3px;position:relative}
.bar i{display:block;height:100%;width:100%}
.bar.thin{height:5px}
#hp{background:linear-gradient(#e8604f,#b83a2e)}#mp{background:linear-gradient(#5aa0f0,#2f68c0)}#xp{background:linear-gradient(#ffe27a,#d6a82a)}
#cmp{text-align:right;font-size:12px}
.cb{position:relative;width:104px;height:7px;margin:3px 0 0 auto;border:1px solid #000;background:linear-gradient(90deg,#d8381f,#8a6a3a 50%,#ffd34a)}
.cb u{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#000}
.cb em{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;background:#fff;border:1px solid #000}
#hb{display:flex;gap:5px;justify-content:flex-end;margin-top:6px;pointer-events:auto}
#hb button{font:bold 11px "Courier New",monospace;background:rgba(30,22,14,.82);color:#f4e9c8;border:1px solid #c9a24a;border-radius:8px;padding:6px 8px}
#boss{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 62px));transform:translateX(-50%);width:min(70vw,300px);z-index:4;display:none;text-align:center;font-size:11px;font-weight:bold;text-shadow:0 1px 0 #000}
#boss .bar{height:8px;margin:2px 0 0}#bhp{background:linear-gradient(#e0402f,#8a1f18)}
#toast{position:fixed;left:0;right:0;top:34%;text-align:center;font-weight:bold;font-size:15px;color:#ffe9a8;opacity:0;transition:opacity .25s;pointer-events:none;-webkit-text-stroke:3px #000;paint-order:stroke fill;z-index:7;padding:0 12px}
#toast.on{opacity:1}
/* dialogue panel (top, over the sky) */
#panel{position:fixed;left:50%;transform:translateX(-50%);top:max(86px,calc(env(safe-area-inset-top) + 78px));width:min(94vw,560px);z-index:8;pointer-events:auto}
#cap{display:none;text-align:center;font:900 clamp(17px,4.8vw,23px)/1.22 Impact,"Arial Black",system-ui,sans-serif;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;letter-spacing:.3px;padding:6px 4px;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28))}
#cap.show{display:block}
#cap i{display:block;font:bold 12px "Courier New",monospace;color:#9fd1ff;-webkit-text-stroke:0;margin-bottom:3px;letter-spacing:1px;text-transform:uppercase}
#cap.nar{font-style:italic;color:#f1e6c6}
#cap b{color:#ffd34a;font-weight:900}
#cap .tip{display:block;margin-top:5px;font:12px "Courier New",monospace;-webkit-text-stroke:0;color:#ccc}
#ch{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.opt{font:inherit;text-align:left;background:rgba(20,14,8,.95);color:#f4e9c8;border:2px solid #c9a24a;border-radius:10px;padding:9px 12px;cursor:pointer}
.opt b{display:block;color:#ffd34a;font-size:15px;-webkit-text-stroke:0}
.opt small{display:block;font-size:12px;opacity:.85;margin-top:2px;font-weight:normal;-webkit-text-stroke:0}
/* objective overlay: compact and readable on mobile */
#objtrack{position:fixed;left:10px;top:max(63px,calc(env(safe-area-inset-top) + 53px));max-width:min(72vw,310px);z-index:6;pointer-events:none;background:rgba(16,13,18,.86);border:1px solid #b39b65;border-radius:7px;padding:5px 8px;color:#fff0c6;font:10px/1.35 "Courier New",monospace}
#objtrack strong{display:block;color:#ffd34a;font-size:10px;margin-bottom:2px}
#objtrack span{display:block}
#jumpbtn,#blockbtn{display:none;pointer-events:auto;width:52px;height:52px;font-size:11px}#jumpbtn{position:absolute;left:auto;right:112px;bottom:calc(14px + env(safe-area-inset-bottom));width:62px;height:62px;z-index:2}#jumpbtn{border-color:#a8eac2;background:#214b33}
#ctl .combat-pad .wk{transform:translateY(-96px)}#blockbtn{border-color:#c5d8ff;background:#203850}#usebtn{pointer-events:auto;display:none;position:absolute;left:50%;bottom:calc(224px + env(safe-area-inset-bottom));transform:translateX(-50%);width:62px;height:62px;font-size:12px;border-color:#fff3b8;background:rgba(59,44,22,.9)}
/* controls */
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 12px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.pad{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.btn{width:66px;height:66px;border-radius:50%;background:rgba(36,26,16,.74);border:2px solid #c9a24a;color:#f4e9c8;font:bold 17px "Courier New",monospace;display:flex;align-items:center;justify-content:center;touch-action:none;padding:0;position:relative;overflow:hidden}
.btn.on,.btn.sel{background:#c9a24a;color:#241a0c}
.btn.big{width:82px;height:82px;font-size:19px;border-color:#ffd34a}
.btn.sm{width:46px;height:46px;font-size:10px;border-radius:12px}
.btn.abl{width:56px;height:56px;font-size:10px;border-color:#9fd1ff}
.btn.abl::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*1%),transparent 0);pointer-events:none}
.wk{display:grid;grid-template-columns:repeat(2,46px);gap:8px}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
#mode{background:#e8c84a;border-color:#fff3b8;color:#2a1c06}
#mode.dusk{background:#5a2c88;border-color:#d27aff;color:#fff}
body:not([data-mode=play]) #hud,body:not([data-mode=play]) #ctl,body:not([data-mode=play]) #boss{display:none}
/* modal */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:12;background:rgba(10,8,14,.94);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#modal.on{display:block}
.mw{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 50px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mh h2{margin:0;font:900 24px Impact,"Arial Black",sans-serif;color:#ffd34a;letter-spacing:1px}
.mh span{font-size:12px;color:#c9c0a0}
.xb,.tb,.bt{font:bold 13px "Courier New",monospace;background:rgba(30,22,14,.9);color:#f4e9c8;border:2px solid #c9a24a;border-radius:9px;padding:8px 12px;cursor:pointer}
.bt.go{background:#c9a24a;color:#241a0c}.bt.dim{opacity:.4;pointer-events:none}.tb.sel{background:#c9a24a;color:#241a0c}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs .tb{flex:1;padding:8px 4px;font-size:12px}
.card{border:2px solid #4a3a28;background:rgba(30,22,16,.92);border-radius:10px;padding:10px;margin-bottom:8px}
.card.k{cursor:pointer}.card.lock{opacity:.45}
.card h4{margin:0 0 3px;font-size:15px;color:#ffe9a8}
.card p{margin:3px 0 0;font-size:12px;line-height:1.35;color:#d8cfae}
.sec{margin:14px 0 6px;font:900 14px Impact,"Arial Black",sans-serif;letter-spacing:1px;color:#c9a24a}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid;margin-left:4px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.cell{min-height:58px;aspect-ratio:1;border:2px solid #444;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:13px;background:#1b1410;cursor:pointer;line-height:1.15}
.cell small{font-size:9px;opacity:.8}.cell.sel{outline:2px solid #fff}
.eq{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}
.eq .cell{min-height:54px;aspect-ratio:.85;font-size:10px;text-align:center}.eq .cell small{font-size:8px}
.stat{font-size:12px;line-height:1.5;color:#e6dcb8}.up{color:#6fe07a}.dn{color:#ff7a6a}
.nodes{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.node{width:30%;max-width:150px;min-height:62px;border:2px solid #555;border-radius:10px;background:#1b1410;color:#f4e9c8;font:bold 11px "Courier New",monospace;padding:6px 4px;text-align:center;cursor:pointer}
.node small{display:block;font-size:10px;opacity:.85;margin-top:3px}
.node.lk{opacity:.4}.node.sel{outline:2px solid #fff}.node.on{background:#2a2216}
.node.ph{visibility:hidden}
.tier{font-size:10px;color:#8a8068;text-align:center;margin:2px 0}
/* title + fade */
#title{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.5);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#title h1{margin:0;font:900 clamp(36px,10vw,68px)/1 Impact,"Arial Black",sans-serif;color:#ffd34a;-webkit-text-stroke:5px #000;paint-order:stroke fill;letter-spacing:2px}
#title p{margin:10px 0 24px;font-size:14px;color:#f4e9c8;text-shadow:0 1px 0 #000}
#title .bt{display:block;min-width:220px;margin:8px auto;font-size:17px;padding:12px}
#fade{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:15}
#fade.on{opacity:1}
#boot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:#0e0a14;color:#f4e9c8;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.5}
#boot b{display:block;font:900 26px Impact,'Arial Black',sans-serif;color:#ffd34a;margin-bottom:10px}
#boot code{color:#ff9a8a;font-size:12px}
@media (orientation:landscape){
 #usebtn{width:44px;height:44px;font-size:10px;bottom:calc(72px + env(safe-area-inset-bottom))}
 #objtrack{top:max(46px,calc(env(safe-area-inset-top) + 38px));max-width:45vw}
 .btn{width:54px;height:54px;font-size:14px}.btn.big{width:68px;height:68px}.btn.sm{width:40px;height:40px;font-size:9px}.btn.abl{width:46px;height:46px}
 .wk{grid-template-columns:repeat(2,40px);gap:6px}
 #jumpbtn{right:94px;bottom:calc(8px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:10px}
 #ctl .combat-pad .wk{transform:translateY(-78px)}
 #usebtn{bottom:calc(188px + env(safe-area-inset-bottom));width:50px;height:50px;font-size:10px}
 #ctl{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
 #panel{top:max(58px,calc(env(safe-area-inset-top) + 52px));width:min(64vw,560px)}
 #cap{font-size:clamp(14px,2.7vw,20px);-webkit-text-stroke:3px #000}
 #toast{top:30%}
}
</style>
</head>

 day:{sky:['#5f8fc8','#7fa7d2','#9fbfd6','#bfd2c8','#dcdcb4','#efdc9c','#f6d68a'],cel:'sun',celC:'#fff4c0',celH:'#f8e6a4',cloud:'#fff7e0',cloud2:'#e4d8b0',mtn:'#7d8cb0',snow:'#eef2f8',forest:'#3f6a3c',hill:'#7ea04c',field:['#b9ad5a','#9fb45a'],wall:'#e8d8ac',beam:'#6a4a30',roof:'#b8553a',stone:'#9a9488',path:'#d4b274',grass:'#6a9a3a',win:'#3a4a6a',glow:0,smk:'120,120,100',birds:1,haze:'#f6e2a0',near:1},

  const heir=fixedItem('sword','Hearthmoor Heirloom Blade',18,2,{ilvl:6,heir:1,aff:[{k:'dmg',v:4}]});
  const back=(G.stash||[]).slice();G.stash=[];
  for(const it of back){if(!G.eq[it.slot])G.eq[it.slot]=it;else addItem(it,true);if(S.rew)S.rew.items.push(it);}
  if(G.eq.sword)G.inv.push(G.eq.sword);G.eq.sword=heir;if(S.rew)S.rew.items.push(heir);
  G.inv=G.inv.filter(x=>x.id!==heir.id);calc();save();return true;
}

const SKB=Object.fromEntries(SK.map(s=>[s.id,s]));
const rank=id=>G.sk[id]||0;
const spent=tr=>SK.filter(s=>s.tr===tr).reduce((a,s)=>a+rank(s.id),0);
function canLearn(s){if(G.pts<1||rank(s.id)>=s.max)return false;if(spent(s.tr)<3*(s.tier-1))return false;if(s.req&&!rank(s.req))return false;return true;}
function learn(id){const s=SKB[id];if(!canLearn(s))return false;G.sk[id]=rank(id)+1;G.pts--;calc();save();return true;}
const respecCost=()=>25*G.lvl;
function respec(){const c=respecCost();if(G.gold<c)return false;G.gold-=c;let n=0;for(const k in G.sk)n+=G.sk[k];G.pts+=n;G.sk={};calc();save();return true;}

function calc(){
  const m={dmg:0,crit:5,hp:0,mp:0,def:0,xp:0,leech:0,regen:0,swordDmg:0,staffDmg:0,bowDmg:0,duskDmg:0,allDmg:0,healKill:0,mpRegen:.8,fear:1.2,dawnHeal:3,shieldPer:0,dodge:0,critMul:1.75,dmgRed:0,bowCd:1,arrowPierce:0,staffPierce:0,kb:0};
  for(const s of SLOTS){const it=G.eq[s];if(!it)continue;if(it.def)m.def+=it.def;for(const a of it.aff)m[a.k]=(m[a.k]||0)+a.v;}
  m.hp+=G.bhp||0;m.mp+=G.bmp||0;
  for(const s of SK){const r=rank(s.id);if(r&&s.fx)s.fx(m,r);}
  const hpPct=P.max?P.hp/P.max:1;
  P.max=Math.round(100+9*(G.lvl-1)+m.hp);P.mmax=Math.round(30+3*(G.lvl-1)+m.mp);
  P.hp=clamp(Math.round(P.max*hpPct),1,P.max);P.mp=Math.min(P.mp,P.mmax);
  S.m=m;
}
const xpNeed=l=>50*l+10*l*l;
function gainXP(n){
  n=Math.round(n*(1+S.m.xp/100));G.xp+=n;if(S.rew)S.rew.xp+=n;let up=0;
  while(G.xp>=xpNeed(G.lvl)&&G.lvl<30){G.xp-=xpNeed(G.lvl);G.lvl++;G.pts++;up++;}
  if(up){calc();P.hp=P.max;P.mp=P.mmax;if(S.rew)S.rew.lv+=up;toast('LEVEL UP!  Lv '+G.lvl+'  (+1 skill point)');sfx(660,.4,'triangle',.06);burst(P.x,GY-20,'#ffe27a',24,160);}
}

  {label:'Share the grain',desc:'Feed the village. The army can wait.',c:15,cl:'Generosity',flag:'shared',maxhp:10,lines:[N('The villagers press warm bread into his hands. He feels *stronger* than he ever has.'),L('Ser Halvard','That is how *good* men are remembered, Corin.')]},
  {label:'Ration it fairly',desc:'Half for the village, half for the road.',c:5,cl:'Fairness',xp:25,lines:[L('Villager','A fair man. That is *rarer* than grain.')]},
  {label:'Requisition it for the war',desc:'Take it all. The cause needs it more.',c:-15,cl:'Tyranny',flag:'seized',maxmp:12,shake:1,lines:[N('The doors splinter. Stolen grain, stolen strength... and the relic *burns* warm.'),L('Ser Halvard','Careful, boy. I have seen where that road ends. I served *Vane\'s* road.')]}]},
 {t:'say',lines:[L('Lysa','Corin... that is no wolf. *Behind* you!')]},
 {t:'wave',list:[{k:'torchraider',s:1,d:0},{k:'torchraider',s:-1,d:.6},{k:'hound',s:1,d:1.8,boss:1,name:'Blight Hound'},{k:'blight',s:-1,d:3.2}],outro:[L('Ser Halvard','Well fought. Better than I deserve.')]},
 {t:'chest',boost:.5}
]},
{id:'m4',type:'main',act:1,title:'The Whispering Reeds',reg:'fen',lvl:3,req:'m3',desc:'The Veilfen. A Marshkin witch knows more than she should.',steps:[
 {t:'say',lines:[N('Veilfen. Mist coils between the reeds, and something old watches from the water.'),L('Lysa','I do not like this place.')]},
 {t:'say',npc:{k:'wren',face:-1},lines:[L('Mother Wren','Then you are *wise*, little archer. But the marsh likes the *brave* more.'),L('Mother Wren','Pretty blades, boy. Let us see if they cut the *rot*.')]},
 {t:'wave',list:[{k:'wisp',s:1,d:0},{k:'wisp',s:-1,d:.8},{k:'boglurker',s:1,d:1.6},{k:'blight',s:-1,d:2.4},{k:'blight',s:1,d:3.2}],outro:[L('Mother Wren','Hm. You hold the bow like a *king* who learned archery in secret.'),L('Corin','Kings do not learn archery from squires.'),L('Mother Wren','No. They learn it from *mothers*. Mind your feet.')]},
 {t:'choice',prompt:'Mother Wren offers a Marshkin bargain.',opts:[
  {label:'Accept her charm',desc:'Wild magic. It will want something back.',c:-4,cl:'Bargain',flag:'wrenPact',loot:{slot:'trinket',rar:2},lines:[L('Mother Wren','Good. The marsh *remembers* a debt.')]},
  {label:'Decline politely',desc:'Honor the gift with thanks, not promises.',c:4,cl:'Honor',flag:'wrenRespect',gold:40,xp:30,lines:[L('Mother Wren','Hah! The old king said no to me, too. *Same* chin.')]},
  {label:'Ask about the old king',desc:'Why does she keep looking at him?',c:2,cl:'Curiosity',flag:'wrenTold',xp:40,lines:[L('Mother Wren','Roderan promised the marsh a *seat* at his table. He died before he could keep it. Do not make the same *mistake*, boy.')]}]},
 {t:'chest',boost:.4}
]},
{id:'m5',type:'main',act:1,title:'A Rival\'s Debt',reg:'hearth',lvl:3,req:'m4',desc:'Brannoch Vale wants his pride back, and he has hired help.',steps:[
 {t:'say',npc:{k:'brannoch',face:-1},lines:[L('Brannoch','Well, if it is not the *orphan* squire.'),L('Brannoch','Father says the Order wastes its time on strays. Let me show you what a *real* knight does.')]},
 {t:'wave',list:[{k:'spearman',s:1,d:0},{k:'bandit',s:-1,d:.6},{k:'archer',s:1,d:1.8},{k:'bandit',s:1,d:3}],outro:[N('The hired Reavers fall. Brannoch is alone, sword shaking, face pale.')]},
 {t:'choice',prompt:'Brannoch lies at Corin\'s feet.',opts:[
  {label:'Offer him a hand',desc:'Help him up. Let him choose what he becomes.',c:10,cl:'Grace',flag:'brannochAlly',xp:40,lines:[L('Brannoch','...Why? I would not have.'),L('Corin','That is the difference between us.')]},
  {label:'Humiliate him publicly',desc:'Let the whole yard see what he is.',c:-8,cl:'Spite',flag:'brannochFoe',lines:[L('Brannoch','You will regret this, *orphan*.')]},
  {label:'Take his signet ring',desc:'A noble\'s ring buys a lot of bread.',c:-3,cl:'Spoils',gold:70,loot:{rar:1},lines:[L('Brannoch','That ring was my *grandfather\'s*!')]}]},
 {t:'chest',boost:.4}
]},
{id:'m6',type:'main',act:1,title:'The Relic Hums',reg:'night',lvl:4,req:'m5',desc:'A mage in the library knows what Corin carries.',steps:[
 {t:'say',npc:{k:'ione',face:-1},lines:[N('Night at Hearthmoor. Corin returns to Magister Ione, who first taught him to wield his rowan staff in the rune garden.'),L('Magister Ione','You carry something that should not exist, squire. Hold out your hand.'),L('Corin','It is only an old amulet Ser Halvard gave me.'),L('Magister Ione','It is a *shard* of the Oathcrown. And it is *singing*.'),N('*You* know whose blood it sings for.'),L('Magister Ione','Listen close. Magic comes in two tides: *Dawn* mends, *Dusk* devours. Try both. Use the toggle.')]},
 {t:'wave',list:[{k:'wisp',s:1,d:0},{k:'wisp',s:-1,d:.6},{k:'wisp',s:1,d:1.4},{k:'blight',s:-1,d:2.2},{k:'blight',s:1,d:3}],outro:[L('Magister Ione','Dawn heals. Dusk hits hard. Both answer to *you*. That is what troubles me.')]},
 {t:'choice',prompt:'Which tide does Corin trust first?',opts:[
  {label:'Dawn',desc:'Light, healing, and the long road.',c:6,cl:'Dawn',flag:'dawnFirst',xp:40,lines:[L('Magister Ione','A healer\'s instinct. It will serve you, and cost you *speed*.')]},
  {label:'Dusk',desc:'Fear and power. Win now, answer later.',c:-6,cl:'Dusk',flag:'duskFirst',xp:40,lines:[L('Magister Ione','Hmm. The power is *real*. So is the price.')]},
  {label:'Both, carefully',desc:'Refuse to choose a side yet.',c:0,flag:'balanced',xp:60,lines:[L('Magister Ione','Wise. Or *foolish*. We shall see.')]}]},
 {t:'chest',boost:1.2}
]},
{id:'m7',type:'main',act:1,title:'The Ashen Hand',reg:'night',lvl:5,req:'m6',desc:'Assassins drop over the walls. Someone sent them for a reason.',steps:[
 {t:'say',lines:[N('Alarm bells. Black-clad figures drop from the walls.'),L('Ser Halvard','The *Ashen* *Hand*. They have found us.'),L('Lysa','Found *us*? Or found *him*?'),L('Ser Halvard','Fight now. Talk later.')]},
 {t:'wave',list:[{k:'acolyte',s:1,d:0},{k:'acolyte',s:-1,d:.7},{k:'ashen',s:1,d:1.5}],outro:[N('A heavy tread behind them. The Regency\'s own blade has come in person.')]},
 {t:'say',npc:{k:'cmdr',face:-1},lines:[L('Captain Sorrel','The Regent was right. The fire did not take *everything*.'),L('Corin','What is he talking about?'),L('Ser Halvard','Nothing. *Fight*.')]},
 {t:'wave',list:[{k:'bandit',s:1,d:0,boss:1,name:'Captain Sorrel Dunmoor',hpm:6,dmgm:1.35,sp:{col:'#6a6e7a',metal:'#8a8f9a',trim:'#c9a24a',hair:'#222',look:2,helm:'#8a8f9a',crest:'plume',crestC:'#a02030',cape:'#6a1a2a',iris:'#4a2a2a',scar:1,nosh:1,w:0}},{k:'ashen',s:-1,d:2.5},{k:'ashen',s:1,d:4}],outro:[N('Sorrel falls to one knee, blade clattering away.')]},
 {t:'choice',prompt:'Captain Sorrel is at Corin\'s mercy.',opts:[
  {label:'Spare him',desc:'A beaten man is a messenger, not a threat.',c:10,cl:'Mercy',flag:'sorrelSpared',xp:50,lines:[L('Captain Sorrel','Fool... Vane will *find* you. But I will remember this.')]},
  {label:'Finish him',desc:'The Regency does not get a second chance.',c:-12,cl:'Ruthless',flag:'sorrelDead',lines:[N('Ser Halvard turns his head. He has seen this before.')]},
  {label:'Question him',desc:'Make him talk first. Decide after.',c:0,flag:'sorrelTold',xp:60,lines:[L('Captain Sorrel','Vane knows the heir lives. He knows it is *somewhere* in Hearthmoor. That is all I know. *Kill* me or do not.')]}]},
 {t:'chest',boost:1.5}
]},
{id:'m8',type:'main',act:1,title:'Trial of Steel',reg:'hearth',lvl:6,req:'m7',desc:'Three trials make a knight: blade, bow and mind.',steps:[
 {t:'say',npc:{k:'cmdr',face:-1},lines:[L('Commander Brandt','Three trials make a knight: the *blade*, the *bow*, and the *mind*. Fail one, and you remain a squire.'),L('Corin','Then I will not fail.')]},
 {t:'wave',list:[{k:'spearman',s:1,d:0},{k:'spearman',s:-1,d:.8},{k:'bandit',s:1,d:3}],outro:[L('Commander Brandt','The blade is yours. Now, the *bow*.')]},
 {t:'wave',list:[{k:'archer',s:1,d:0},{k:'archer',s:-1,d:.6},{k:'archer',s:1,d:1.2},{k:'archer',s:-1,d:2}],outro:[L('Commander Brandt','Good eye. Now the hardest: the *mind*. The blight does not tire. Neither may you.')]},
 {t:'wave',list:[{k:'blight',s:1,d:0},{k:'blight',s:-1,d:.4},{k:'blight',s:1,d:.8},{k:'blight',s:-1,d:1.6},{k:'hound',s:1,d:3,boss:1,name:'Trial Hound'},{k:'blight',s:-1,d:4}],outro:[L('Commander Brandt','You pass. The vigil is tonight. Tomorrow you are a *knight*... if you survive tonight.')]},
 {t:'chest',boost:2},
 {t:'say',lines:[N('Hearthmoor will not see another quiet dawn.')]}
]},
{id:'s1',type:'side',act:1,title:'Lysa\'s Challenge',reg:'hearth',lvl:1,after:'m1',desc:'Bet you cannot outshoot me, squire.',steps:[
 {t:'say',lines:[L('Lysa','Bet you cannot outshoot me, squire.'),L('Corin','Name the stakes.'),L('Lysa','Loser polishes *everyone\'s* armor.')]},
 {t:'wave',list:[{k:'blight',s:1,d:0},{k:'blight',s:-1,d:.5},{k:'blight',s:1,d:1},{k:'blight',s:-1,d:1.5}],outro:[L('Lysa','Not bad. For a boy with a sword.')]},
 {t:'loot',slot:'bow',rar:2,lines:[L('Lysa','Take it. It shoots straighter than I do.')]}
]},
{id:'s2',type:'side',act:1,title:'The Lost Lamb',reg:'green',lvl:2,after:'m2',desc:'A child begs for help against the wolves.',steps:[
 {t:'say',npc:{k:'child',face:-1},lines:[L('Child','Please! Wolves took my *lamb*!')]},
 {t:'wave',list:[{k:'blight',s:1,d:0},{k:'blight',s:-1,d:.7},{k:'blight',s:1,d:1.4}],outro:[N('A trembling lamb, tied to a fencepost, bleats softly.')]},
 {t:'choice',prompt:'The lamb wears a silver collar.',opts:[
  {label:'Return the lamb',desc:'Give it back to the child.',c:8,cl:'Kindness',xp:30,lines:[L('Child','Thank you! Thank you, *Ser*!')]},
  {label:'Sell the collar',desc:'Silver is silver.',c:-4,cl:'Greed',gold:60,lines:[N('The child watches in silence.')]}]}
]},
{id:'s3',type:'side',act:1,title:'Unpaid Taxes',reg:'green',lvl:3,after:'m3',desc:'Reavers have hit a Regency tax wagon. Who gets the coin?',steps:[
 {t:'say',lines:[N('A Regency tax wagon, overturned. Reavers circle it like crows.')]},
 {t:'wave',list:[{k:'bandit',s:1,d:0},{k:'bandit',s:-1,d:.7},{k:'archer',s:1,d:1.4},{k:'bandit',s:-1,d:2.2}]},
 {t:'choice',prompt:'The tax wagon is full of coin.',opts:[
  {label:'Escort it to the Regency',desc:'Order is order, even Vane\'s.',c:-4,cl:'Order',gold:80,lines:[L('Lysa','You are helping *Vane*.'),L('Corin','I am keeping the road *open*.')]},
  {label:'Burn the wagon',desc:'Let nothing reach the Regent.',c:6,cl:'Defiance',loot:{rar:1},lines:[N('The flames climb high. Somewhere, a tax collector weeps.')]},
  {label:'Return the coin to the villagers',desc:'It was theirs to begin with.',c:10,cl:'Charity',xp:50,lines:[L('Villager','The *Greenmarch* will remember this.')]}]}
]},
{id:'s4',type:'side',act:1,title:'Marsh Lanterns',reg:'fen',lvl:3,after:'m4',desc:'Pale lights whisper names across the water.',steps:[
 {t:'say',lines:[N('Pale lanterns drift over the water, whispering names.'),L('Lysa','Do not follow them.')]},
 {t:'wave',list:[{k:'blight',s:1,d:0},{k:'blight',s:-1,d:.6},{k:'blight',s:1,d:1.2},{k:'blight',s:-1,d:1.8},{k:'hound',s:1,d:3.2,boss:1,name:'Marsh Hound'}]},
 {t:'choice',prompt:'Two lanterns remain: one warm and gold, one cold and violet.',opts:[
  {label:'Take the golden lantern',desc:'Dawn light.',c:5,cl:'Dawn',loot:{slot:'trinket',rar:2},lines:[N('It hums softly against the relic.')]},
  {label:'Take the violet lantern',desc:'Dusk light.',c:-5,cl:'Dusk',loot:{slot:'trinket',rar:2},lines:[N('It whispers a name. *Roderan*.')]}]}
]},
{id:'s5',type:'side',act:1,title:'The Armorer\'s Debt',reg:'hearth',lvl:4,after:'m5',desc:'Three Reavers took Tobren\'s forge over a debt he never owed.',steps:[
 {t:'say',npc:{k:'armorer',face:-1},lines:[L('Tobren','They took my forge. Three Reavers, a *debt* I never owed.')]},
 {t:'wave',list:[{k:'bandit',s:1,d:0},{k:'bandit',s:-1,d:.7},{k:'bandit',s:1,d:1.4}],outro:[L('Tobren','You have my thanks, Ser. And my *gratitude*.')]},
 {t:'choice',prompt:'Tobren offers to repay the favor.',opts:[
  {label:'Forgive his debt',desc:'He has lost enough.',c:8,cl:'Kindness',loot:{slot:'armor',rar:2},lines:[L('Tobren','Take this. I made it for my *son*.')]},
  {label:'Collect what he owes',desc:'A fair wage for a fair fight.',c:-4,cl:'Cold',gold:90,lines:[N('Tobren counts the coins in silence.')]}]}
]},
{id:'m9',type:'main',act:1,title:'The Vigil',reg:'chapel',lvl:6,req:'m8',desc:'A night of prayer before knighthood. Something watches from the dark.',steps:[
 {t:'say',lines:[N('Hearthmoor Chapel. A single candle, a bare stone floor, and the long hours until dawn.'),L('Ser Halvard','A knight keeps vigil alone. Kneel, *Corin*. Think on what you will *protect*.'),L('Corin','And if I do not know what I am protecting?'),L('Ser Halvard','Then you have the whole night to *decide*.')]},
 {t:'choice',prompt:'What vow does Corin speak into the dark?',opts:[
  {label:'Vow of Mercy',desc:'"I will shield the weak, even from my own anger."',c:10,cl:'Mercy',flag:'vowMercy',xp:60,lines:[N('The candle steadies. Warmth gathers around the relic.')]},
  {label:'Vow of Iron',desc:'"I will be the wall no enemy can pass."',c:-10,cl:'Iron',flag:'vowIron',xp:60,lines:[N('The candle gutters. The relic turns cold and heavy.')]},
  {label:'Vow of Silence',desc:'Say nothing. Let deeds speak.',c:0,flag:'vowSilence',xp:90,lines:[L('Magister Ione','...Interesting. The relic *listened* to the silence.')]}]},
 {t:'say',npc:{k:'ione',face:-1},lines:[L('Magister Ione','Do not rise, Corin. The shard draws things. Hold the line.')]},
 {t:'wave',list:[{k:'blight',s:1,d:0},{k:'blight',s:-1,d:.5},{k:'blight',s:1,d:1},{k:'blight',s:-1,d:1.5},{k:'blight',s:1,d:2.2}],outro:[L('Magister Ione','The blight is *hunting* the shard. It knows what it is. Do not tell Halvard I said so.')]},
 {t:'say',flag:'knighted',lines:[N('Dawn. Bells ring across Hearthmoor.'),L('Commander Brandt','By the oath you swore and the blade you have earned... rise, *Ser* Corin of Hearthmoor.'),L('Lysa','*Ser* Corin. It suits you.'),L('Ser Halvard','...Rise, boy. You were always going to.')]},
 {t:'loot',slot:'sword',rar:2,lines:[L('Commander Brandt','A knight\'s blade. Make it *count*.')]},
 {t:'chest',boost:1.5,out:.25}
]},
{id:'m10',type:'main',act:1,title:'Fire at Hearthmoor',reg:'night',lvl:7,req:'m9',
 desc:'The fall of Hearthmoor. Cross six battlefields, defend the gate, save civilians, protect the chapel, and escape the keep.',
 areas:[
 {id:'outskirts',title:'The Outer Fields',reg:'green',steps:[
  {t:'say',lines:[N('Smoke darkens the eastern sky. Regency banners fill the valley below Hearthmoor.'),L('Lysa','Scouts on the farm road. If they reach the walls first, the castle will be taken *unaware*.'),L('Corin','Then we get to the watchtower. Sound the alarm.')]},
  {t:'wave',goal:'Break through the Regency scouts',list:[{k:'spearman',s:1,d:0},{k:'crossbow',s:-1,d:.7},{k:'spearman',s:1,d:1.4},{k:'crossbow',s:-1,d:2.2}]},
  {t:'interact',goal:'Reach the watchtower and ring the alarm',name:'ALARM BELL',flag:'m10warned',lines:[L('Corin','Hearthmoor! To *arms*!'),N('The warning bell cuts through the smoke. Soldiers rush to their posts.')]},
  {t:'say',lines:[L('Ser Halvard','You bought us a few precious minutes. Ride to the *gatehouse*. We shall need every one.')]}
 ]},
 {id:'gatehouse',title:'The Broken Gate',reg:'hearth',steps:[
  {t:'say',lines:[N('The gatehouse shudders under the Regent\'s battering rams.'),L('Commander Brandt','*Hold* the portcullis! They must not reach the village.')]},
  {t:'defend',goal:'Keep the gate standing through the assault',target:'Gate',hp:145,list:[
    {k:'spearman',s:1,d:0},{k:'crossbow',s:-1,d:.7},{k:'bandit',s:1,d:1.3},{k:'sapper',s:-1,d:2.1},{k:'archer',s:1,d:3.0}
   ],outro:[L('Commander Brandt','The first assault is broken. Now seal the mechanism!')]},
  {t:'interact',goal:'Reach the winch and secure the portcullis',name:'GATE WINCH',flag:'m10gateSecured',lines:[N('Iron chains grind. The portcullis slams shut behind the final defenders.')]},
  {t:'say',lines:[L('Lysa','Smoke in the lower streets. The villagers are still inside.'),L('Corin','Then the battle is not finished.')]}
 ]},
 {id:'village',title:'The Burning Village',reg:'night',steps:[
  {t:'say',lines:[N('Hearthmoor\'s lower village burns. Families flee between shattered market stalls.'),L('Lysa','There are people behind the barricade. And Regency soldiers at the storehouse.')]},
  {t:'wave',goal:'Clear the market street',list:[
    {k:'bandit',s:1,d:0},{k:'archer',s:-1,d:.8},{k:'ashen',s:1,d:1.7},{k:'bandit',s:-1,d:2.4}
   ]},
  {t:'choice',goal:'Decide whom to save in the village',prompt:'The gate is cracking again. Villagers pound on the postern.',opts:[
    {label:'Hold the gate',desc:'Guard the passage while families escape.',c:4,cl:'Duty',flag:'heldGate',xp:50,lines:[N('Corin holds the line while the last families pass through the smoke.')]},
    {label:'Open the postern',desc:'Evacuate everyone, even if the gate falls.',c:12,cl:'Compassion',flag:'evacuated',maxhp:8,lines:[N('Hundreds stream into the chapel and cellars. They will remember.')]},
    {label:'Burn the bridge',desc:'Cut off the attack. Some may be left outside.',c:-10,cl:'Ruthless',flag:'burnedBridge',lines:[N('Flames swallow the bridge. Behind them the street falls silent.')]}
   ]},
  {t:'interact',goal:'Recover the remaining supplies',name:'SUPPLY CACHE',flag:'m10supplies',lines:[N('Corin gathers medicine, bandages and dry provisions for the survivors.')]}
 ]},
 {id:'chapel',title:'The Chapel Ward',reg:'chapel',steps:[
  {t:'say',lines:[N('Under the chapel, the Oathcrown shard burns brighter than the candles.'),L('Magister Ione','The blight feels the shard. If I can raise the old *ward*, the wounded can escape.'),L('Corin','Tell me what you need.')]},
  {t:'wave',goal:'Clear the chapel approach',list:[
    {k:'boglurker',s:1,d:0},{k:'blight',s:-1,d:.5},{k:'hound',s:1,d:1.4},{k:'ashen',s:-1,d:2.3}
   ]},
  {t:'interact',goal:'Activate the Dawnroot focus',name:'WARD FOCUS',flag:'m10focus',lines:[L('Magister Ione','Now! The ward is awake. Hold it while I bind the runes.')]},
  {t:'defend',goal:'Protect Ione\'s ward from the blight',target:'Chapel Ward',hp:160,list:[
    {k:'blight',s:1,d:0},{k:'blight',s:-1,d:.55},{k:'ashen',s:1,d:1.2},{k:'blight',s:-1,d:1.8},{k:'hound',s:1,d:2.8}
   ],outro:[L('Magister Ione','It holds! Go to the keep. I will shepherd the wounded through the crypts.')]}
 ]},
 {id:'keep',title:'The Inner Keep',reg:'keep',steps:[
  {t:'say',lines:()=>G.flags.brannochAlly?[L('Brannoch','Ser Corin! I kept the stair open. Now we hold it *together*.')]:G.flags.brannochFoe?[L('Brannoch','You are late, orphan. I have no intention of dying for your *pride*.')]:[N('In the inner keep, the last defenders gather behind the fallen banners.')]},
  {t:'wave',goal:'Fight through the elite assault',list:[
    {k:'ashen',s:1,d:0},{k:'ashen',s:-1,d:.7},{k:'archer',s:1,d:1.4},{k:'bandit',s:-1,d:2.1}
   ]},
  {t:'say',lines:()=>G.flags.sorrelSpared?[N('Captain Sorrel stands beyond the broken gate. Recognizing Corin, he withdraws his men without a word.')]:G.flags.sorrelDead?[N('Without Sorrel, the Regency line falters. The Ashen Hand presses on.')]:[N('Lord Garran Vale storms into the keep, armored in the Regent\'s colors.')]},
  {t:'wave',goal:'Defeat Lord Garran Vale',list:[
    {k:'bandit',s:1,d:0,boss:1,name:'Lord Garran Vale',hpm:7,dmgm:1.4,sp:{col:'#5a2a8a',metal:'#c0c8d8',trim:'#e8b84a',look:2,helm:'#c0c8d8',crest:'plume',crestC:'#5a2a8a',cape:'#2a1040',iris:'#3a2a5a',nosh:1,w:0}},
    {k:'ashen',s:-1,d:2.5},{k:'archer',s:1,d:4}
   ],outro:[N('Garran falls. An arrow arcs down from the ramparts.'),L('Lysa','*Halvard*!'),N('A shaft strikes Halvard\'s shoulder. He drops to one knee.'),L('Ser Halvard','The cellar passage. Go, boy! The *castle* is lost.')]}
 ]},
 {id:'cellar',title:'The Cellar Passage',reg:'cave',steps:[
  {t:'say',lines:[N('Smoke follows Corin into the tunnels below Hearthmoor.'),L('Lysa','The eastern tunnel is blocked. We need to open the old escape shaft.'),L('Ser Halvard','Quickly. They are behind us.')]},
  {t:'interact',goal:'Open the ancient cellar lock',name:'CELLAR LOCK',flag:'m10cellarOpen',lines:[N('A rusted lever gives way. Cold air pours from the forgotten passage.') ]},
  {t:'wave',goal:'Drive off the pursuing enemies',list:[
    {k:'ashen',s:-1,d:0},{k:'blight',s:1,d:.8},{k:'hound',s:1,d:1.8},{k:'ashen',s:-1,d:2.5}
   ]},
  {t:'chest',boost:2.2,out:.35,goal:'Gather provisions for the road',lines:[L('Lysa','Take what we can carry. The wounded will need it.')]},
  {t:'say',flag:'m10escaped',goal:'Escape the fallen castle',lines:[N('Behind them, the banners of Hearthmoor vanish in the flames.'),L('Corin','The castle may have fallen. But we are not *finished*.'),N('Beyond the passage waits the Greenmarch and the long night.')]}
 ]}
 ]},
{id:'m11',type:'main',act:1,title:'The Long Night',reg:'night',lvl:8,req:'m10',endLoc:'green',desc:'Through the cellar road and across the Greenmarch, with the Regency on their heels.',steps:[

function adventureBegin(area){
  const d=area.explore;
  if(!d){S.adv=null;P.py=0;P.vy=0;P.grounded=true;S.camY=0;const j=$('jumpbtn');if(j)j.style.display='flex';return;}
  S.adv={
    length:d.length||1000,
    platforms:(d.platforms||[]).map(p=>({x:p.x,w:p.w,y:p.y,kind:p.kind||null})),
    objects:(d.objects||[]).map((o,i)=>Object.assign({i,done:!S.replay&&!!(o.flag&&G.flags[o.flag])},o)),
    scenery:d.scenery||'castle',seed:d.seed||5,verticalCamera:!!d.verticalCamera,
    progress:0,combatAt:(d.combatAt||[]).map((w,i)=>Object.assign({i,done:false},w))
  };
  P.py=0;P.vy=0;P.grounded=true;S.camY=0;S.joust=null;
  S.activeInteract=null;
  const b=$('jumpbtn');if(b)b.style.display='flex';
  const block=$('blockbtn');if(block)block.style.display=G.shieldTier>=0?'flex':'none';
  missionHud(true);
}
function adventureEnd(){
  S.adv=null;S.joust=null;S.camY=0;P.py=0;P.vy=0;P.grounded=true;

}

function adventureNear(){
  if(!S.adv||S.talk||S.arena||S.joust)return null;

  for(const o of S.adv.objects){
    if(o.done)continue;
    const d=Math.abs(P.x-o.x);
    if(d<34&&Math.abs((P.py||0)-(o.y||0))<24&&d<dist){dist=d;near=o;}
  }

}

function adventureJoustFinish(){

  if(o){o.done=true;G.flags[o.flag||'joustServed']=1;save();}
  S.joust=null;toast('TOURNAMENT COMPLETE: '+j.score+' / '+j.passes+' HANDOFFS');
  if(j.score>=2){G.gold+=35;if(S.rew)S.rew.gold+=35;}
  if(giveBluntSword())say([L('Ser Halvard','You served well, lad. This blade is blunt, but it is iron. A squire should feel real weight in his hand.'),N('BLUNT IRON SWORD RECEIVED')],()=>{});

function adventureUpdate(dt){
  const a=S.adv;if(!a||S.mode!=='play')return;
  if(S.joust){joustStep(S.joust,dt);if(joustDone(S.joust))adventureJoustFinish();else if(S.joust.role==='rider')P.x=clamp(S.joust.a.x,10,a.length);}
  const prev=P.py||0;
  // Walk off ledges naturally. A platform only supports the hero while
  // the feet are over its interval; no invisible floor under upper stories.
  const standing=a.platforms.some(p=>P.x>=p.x-4&&P.x<=p.x+p.w+4&&Math.abs(prev-p.y)<2);
  if(P.grounded&&prev<0&&!standing)P.grounded=false;
  if(!P.grounded){
    P.vy=Math.min(460,(P.vy||0)+620*dt);
    P.py=prev+P.vy*dt;
    if(P.vy>=0){
      let surface=0;
      for(const p of a.platforms){
        if(P.x>=p.x-4&&P.x<=p.x+p.w+4&&prev<=p.y+2&&P.py>=p.y-1&&p.y<surface)surface=p.y;
      }
      if(P.py>=surface){P.py=surface;P.vy=0;P.grounded=true;}
    }
  }else{P.vy=0;}
  // Keep short rooms steady: the hero jumps while platforms and walls remain fixed.
  // Reserve vertical following for deliberately tall tower and cavern maps.
  S.camY=a.verticalCamera?lerp(S.camY,Math.min(0,(P.py||0)+48),Math.min(1,dt*7)):0;
  // Road sections: scripted enemies inhabit traversed terrain; one wave
  // per checkpoint and distinct region-specific composition.
  for(const w of a.combatAt){
    if(!w.done&&P.x>=w.x&&!S.arena&&!S.talk){
      w.done=true;wave(w.list,()=>{missionHud(true);});break;
    }
  }
}

function drawSupportedPlatform(p,cam,ground,scenery){
  const x=Math.round(p.x-cam),w=p.w,top=Math.round(ground+p.y),h=Math.max(0,-p.y);

    scenery==='lists'?'bleachers':'outcrop');
  const wood=['workbench','loft','rack','hayloft','tackbench','bleachers'].indexOf(kind)>=0;
  if(!wood){
    // Outcrops are stone rising from the earth. The shelf is supported by an
    // irregular rock face that extends all the way down to the ground.
    R(x+5,top+5,w-10,Math.max(0,h-5),'#5d5d5c');

function pixRoadDetail(cam,cfg){
  const type=cfg.style;
  if(!['farmroad','forest','frontier','granary','fen'].includes(type))return;
  const rng=pixRandom((cfg.seed||17)+400),cols=PIXEL_SCENES[type],base=GY-3;
  const layouts=type==='farmroad'||type==='granary'?
     ['fence','house','bridge','cart','shrine','orchard','house','cart','bridge','fence','house']:
     type==='forest'?['pines','log','pines','shrine','fallen','pines','rocks','pines','log']:
     type==='fen'?['reeds','bridge','pines','lantern','reeds','shrine','reeds','bridge']:
     ['rocks','pines','shrine','rocks','pines','fallen','rocks','pines'];
  for(let k=0;k<layouts.length;k++){
    const worldX=80+k*167+(rng()-.5)*67;
    const x=worldX-cam*.65;
    if(x<-180||x>W+180)continue;
    const name=layouts[k];
    if(name==='fence'){pixWoodFence(g,x,base,114);continue;}
    if(name==='house'){pixRoadHouse(g,x,base,rng);continue;}
    if(name==='bridge'){pixRoadBridge(g,x,base);continue;}
    if(name==='cart'){pixRoadWagon(g,x,base);continue;}
    if(name==='shrine'){pixRoadShrine(g,x,base);continue;}
    if(name==='orchard'||name==='pines'){
      for(let j=0;j<4;j++)pixFir(g,x+j*25,base,35+rng()*54,cols.tree,cols.mid,rng);
      continue;
    }
    if(name==='reeds'||name==='lantern'){
      pixRect(g,x-7,base-13,93,11,'#467870');
      for(let j=0;j<19;j++){
        const xx=x+j*5,ht=11+rng()*26;
        pixRect(g,xx,base-ht,2,ht,cols.tree);
        if(j%3===0)pixRect(g,xx-1,base-ht-5,4,8,'#84745a');
      }
      if(name==='lantern'){
        pixRect(g,x+42,base-72,5,71,'#635948');
        pixRect(g,x+36,base-78,18,9,'#e8cb8a');
        pixRect(g,x+40,base-75,10,6,'#f4e9ab');
      }
      continue;
    }
    if(name==='log'||name==='fallen'){
      pixRect(g,x-5,base-15,112,14,'#685246');
      pixRect(g,x-4,base-12,110,4,'#917763');
      pixRect(g,x+96,base-14,10,11,'#af9373');
      pixRect(g,x+99,base-11,4,5,'#73604d');
      continue;
    }
    if(name==='rocks'){
      for(let j=0;j<7;j++){
        const xx=x+j*19,ht=12+rng()*20,ww=13+rng()*22;
        pixPoly(g,[[xx,base],[xx+4,base-ht*.75],[xx+ww*.35,base-ht],
          [xx+ww*.8,base-ht*.65],[xx+ww,base]],cols.rock);
        pixPoly(g,[[xx+4,base-ht*.75],[xx+ww*.35,base-ht],
          [xx+ww*.51,base-ht*.57],[xx+4,base-ht*.5]],cols.mid);
      }
    }
  }
}

function loadMissionArea(idx){

function endMissionArea(){

    if(S.areaIndex>=m.areas.length-1){
      G.loc=m.endLoc;G.day=(G.day||1)+m.travelDays;save();
      toast('ARRIVED AT '+NODES[m.endLoc].n.toUpperCase());

function missionHud(force){

  const a=S.areaData,goals=S.beats.filter(b=>b.st.goal);
  const current=goals.find(b=>!S.goalsDone[b.i]);
  const label=S.joust?(S.joust.role==='rider'?'Pass '+S.joust.round+'/'+S.joust.passes+': tap COUCH when the foe lowers his lance':'Pass '+S.joust.round+'/'+S.joust.passes+': tap USE as the rider reaches your hand'):current?current.st.goal:'Proceed to the next area';
  const count=goals.filter(b=>S.goalsDone[b.i]).length;
  const guard=S.guard?' | '+S.guard.name+' '+Math.max(0,Math.ceil(S.guard.hp))+'/'+S.guard.max:'';
  const html=(S.areaIndex+1)+'/'+S.mission.areas.length+'  '+a.title+'  ('+count+'/'+goals.length+')'+guard+'|'+label;

const LN=x=>typeof x==='function'?x():x;
function runStep(b){
  const st=b.st,last=b.i===S.beats.length-1,fin=()=>{
    if(st.flag)G.flags[st.flag]=1;
    if(st.goal)S.goalsDone[b.i]=true;
    missionHud(true);
    if(last){endMissionArea();return;}
    // Story choices should appear while the speaker/defeated opponent is still
    // on screen. Older quests put them 270 world units after the previous event.
    if(S.beats[S.bi]&&S.beats[S.bi].st.t==='choice'&&!S.arena&&!S.talk){
      const next=S.beats[S.bi++];
      runStep(next);
    }
  };
  switch(st.t){
   case 'explore':{if(st.intro)say(LN(st.intro),()=>missionHud(true));else missionHud(true);break;}
   case 'say':if(st.npc)S.npc={k:st.npc.k,x:P.x+28,face:-1};say(LN(st.lines),fin);break;
   case 'toast':toast(st.text);fin();break;
   case 'wave':{S.npc=null;const go=()=>wave(st.list,()=>{if(st.outro)say(LN(st.outro),fin);else fin();});if(st.intro)say(LN(st.intro),go);else go();break;}
   case 'defend':{
     const go=()=>{
       S.guard={x:P.x-24,hp:st.hp||110,max:st.hp||110,name:st.target||'Ward'};
       wave(st.list,()=>{S.guard=null;missionHud(true);if(st.outro)say(LN(st.outro),fin);else fin();});
       missionHud(true);
     };
     if(st.intro)say(LN(st.intro),go);else go();break;
   }
   case 'interact':
     S.npc=null;S.activeInteract={x:b.x+110,st,done:fin};
     toast('REACH '+st.name.toUpperCase()+' AND TAP USE');break;
   case 'choice':if(S.replay){S.npc=null;fin();break;}
     choose(st.prompt,st.opts.map(o=>({label:o.label,desc:o.desc,fn:()=>applyChoice(o,fin)})));break;
   case 'chest':{const run=()=>{openChest(b,st.boost||0,st.out);fin();};if(st.lines)say(LN(st.lines),run);else run();break;}
   case 'loot':{const run=()=>{giveLoot(st);fin();};if(st.lines)say(st.lines,run);else run();break;}
  }
}

// Vertical combat spaces use world Y relative to the floor (0 = ground).

  return !!(S.adv&&P.grounded&&(P.py||0)<-12&&(e.py||0)>=-2);

function heroEnemyOverlap(e){
  if(!S.adv)return true; // keep old flat missions unchanged

  return feet-1>ef-enemyCombatHeight(e)+2&&feet-44<ef-2;

function hostileProjectileHitsHero(pr){

function updateCombat(dt){
  for(const e of enemies){
    e.t+=dt;if(e.hurt>0)e.hurt-=dt;if(e.fear>0)e.fear-=dt;if(e.stun>0)e.stun-=dt;e.cd-=dt;if(e.atkA>0)e.atkA-=dt*4;

      else{e.atkA=1;if(ad<def.rng+10){if(targetGuard)hurtGuard(e.dmg);else if(heroEnemyOverlap(e))hurtPlayer(e.dmg,e.face);}e.cd=1.2+rnd()*.4;}}
      continue;}
    if(e.dashT>0){e.dashT-=dt;if(ad<16&&!e.dashHit){e.dashHit=1;if(e.dashGuard&&S.guard)hurtGuard(e.dmg);else if(heroEnemyOverlap(e))hurtPlayer(e.dmg,e.face);}continue;}
    if(S.arena&&!e.in){e.x+=Math.sign(d)*sp*1.3*dt;e.mv=true;continue;}
    if(e.fear>0){e.x-=Math.sign(d)*sp*dt;e.mv=true;continue;}

  let s='<svg id="mapsvg" viewBox="0 0 360 470" style="width:100%;display:block;border:3px solid #5a4028;border-radius:10px;background:#e6d5a2"><defs><radialGradient id="vg"><stop offset="55%" stop-color="#e6d5a2" stop-opacity="0"/><stop offset="100%" stop-color="#7a5a2a" stop-opacity=".6"/></radialGradient></defs>';
  // terrain
  for(let k=0;k<40;k++)s+='<rect x="'+Math.round(r()*340)+'" y="'+Math.round(r()*450)+'" width="3" height="1" fill="#d4c08a"/>';
  s+='<path d="M340 150 C300 190 240 220 232 290 S196 400 188 470" fill="none" stroke="#5a88a8" stroke-width="8" stroke-linecap="round"/><path d="M340 150 C300 190 240 220 232 290 S196 400 188 470" fill="none" stroke="#9cc4e0" stroke-width="4" stroke-linecap="round"/>';
  for(const [mx,my] of [[270,64],[298,58],[326,76],[286,92],[336,112],[312,96],[244,50],[150,44],[200,52],[226,34]]){const h=18+Math.round(r()*10);s+='<polygon points="'+mx+','+my+' '+(mx+14)+','+(my-h)+' '+(mx+28)+','+my+'" fill="#a89878" stroke="#5a4028"/><polygon points="'+(mx+14)+','+(my-h)+' '+(mx+9)+','+(my-h+9)+' '+(mx+19)+','+(my-h+9)+'" fill="#fff"/>';}
  for(let k=0;k<26;k++){const tx=228+r()*92,ty=204+r()*74;s+='<polygon points="'+tx+','+(ty+6)+' '+(tx+4)+','+(ty-4)+' '+(tx+8)+','+(ty+6)+'" fill="#6a8a4a" stroke="#2a4a2a" stroke-width=".6"/>';}
  for(let k=0;k<22;k++){const tx=20+r()*100,ty=336+r()*76;s+='<path d="M'+tx+' '+ty+' l0 -7 M'+(tx+3)+' '+ty+' l1 -5" stroke="#3a7a6a" stroke-width="1.2"/>';}
  for(let k=0;k<6;k++)s+='<rect x="'+(66+k*12)+'" y="238" width="10" height="'+(40+(k%2)*6)+'" fill="'+(k%2?'#c8b862':'#b4c070')+'" opacity=".7"/>';
  s+='<path d="M0 470 L0 440 Q20 430 40 440 L40 470Z" fill="#7aa8c8" opacity=".5"/>';
  s+='<rect width="360" height="470" fill="url(#vg)"/>';
  // roads
  for(const e of EDGES){const A=NODES[e.a],B=NODES[e.b],op=e.open(),d='M'+A.x+' '+A.y+' Q'+e.c[0]+' '+e.c[1]+' '+B.x+' '+B.y;
    s+='<path d="'+d+'" fill="none" stroke="'+(op?'#6a4020':'#9a8a6a')+'" stroke-width="'+(op?3:2)+'" stroke-dasharray="'+(op?'5 3':'2 4')+'" stroke-linecap="round"/>';
    if(!op){const m=bez([A.x,A.y],e.c,[B.x,B.y],.5);s+='<g transform="translate('+m[0]+' '+m[1]+')"><circle r="5.5" fill="#8a2a2a" stroke="#2a0a0a"/><path d="M-2.5 -2.5 l5 5 M2.5 -2.5 l-5 5" stroke="#fff" stroke-width="1.4"/></g>';}}
  // nodes
  for(const id in NODES){const n=NODES[id],lk=!!n.lock;
    s+='<g data-a="node" data-v="'+id+'" transform="translate('+n.x+' '+n.y+')" opacity="'+(lk?.5:1)+'" style="cursor:pointer">'+(sel===id?'<circle r="22" fill="none" stroke="#c0402a" stroke-width="2" stroke-dasharray="3 2"/>':'')+'<circle r="19" fill="rgba(0,0,0,0)"/>'+nodeIcon(n)
     +'<text x="'+(n.x<60?-12:n.x>296?12:0)+'" y="'+(n.t==='tower'||n.t==='spire'?20:22)+'" text-anchor="'+(n.x<60?'start':n.x>296?'end':'middle')+'" font-size="9" font-weight="bold" font-family="Courier New,monospace" fill="#2a1a08" style="paint-order:stroke;stroke:#f0e2b4;stroke-width:3px">'+(lk?n.n+' ('+n.lock.replace('ACT ','')+')':n.n)+'</text></g>';}
  // dungeons badge + marker
  const c=NODES[cur];
  s+='<g id="mk" transform="translate('+c.x+' '+(c.y-30)+')"><ellipse cx="0" cy="26" rx="7" ry="2" fill="rgba(0,0,0,.25)"/><circle r="9" fill="#ffd34a" stroke="#3a2410" stroke-width="1.5"/><text y="4" text-anchor="middle" font-size="12" fill="#3a2410">&#9819;</text></g>';
  return s+'</svg>';
}
function mcard(m){
  const st=mstate(m),col=m.type==='main'?'#ffd34a':m.type==='dungeon'?'#c070ff':'#9fd1ff',nm=m.type==='main'?'MAIN':m.type==='dungeon'?'DUNGEON':'SIDE';
  return '<div class="card k'+(st==='lock'?' lock':'')+'" '+(st!=='lock'?'data-a="brief" data-v="'+m.id+'"':'')+'><h4>'+(st==='done'?'&#10003; ':'')+m.title+'<span class="pill" style="color:'+col+';border-color:'+col+'">'+nm+'</span><span class="pill" style="color:#aaa;border-color:#555">Lv '+m.lvl+'</span></h4><p>'+(st==='lock'?'Locked. Finish an earlier mission first.':m.desc)+'</p></div>';
}
function mstate(m){
  // Legacy saves from v0.4/v0.5 already progressed beyond the new prologue.
  if(m.id==='m0'&&G.done.m1&&!G.done.m0)return 'done';
  if(m.type==='main'){if(!m.req||G.done[m.req])return G.done[m.id]?'done':'open';return 'lock';}
  return G.done[m.after]?(G.done[m.id]?'done':'open'):'lock';
}

  h+=mapSvg(sel);
  h+='<div class="card" style="margin-top:8px"><h4>'+N0.n+(N0.lock?'<span class="pill" style="color:#aaa;border-color:#555">'+N0.lock+'</span>':'')+(here?'<span class="pill" style="color:#6fe07a;border-color:#6fe07a">YOU ARE HERE</span>':'')+'</h4><p>'+N0.d+'</p>';
  if(UI.msg)h+='<p class="dn">'+UI.msg+'</p>';
  if(!here){const p=findPath(G.loc,sel);if(p){const days=p.reduce((a,x)=>a+x.e.d,0);h+='<button class="bt go" data-a="go" data-v="'+sel+'" style="width:100%;margin-top:8px">TRAVEL ('+days+' day'+(days>1?'s':'')+' via '+p.map(x=>x.e.n).join(', ')+')</button>';}
    else{const q=findPath(G.loc,sel,true),blk=q&&q.find(x=>!x.e.open());h+='<p class="dn">No open route. '+(blk?blk.e.n+': '+blk.e.why:'Unknown lands.')+'</p>';}}
  h+='<div id="tmsg" class="stat"></div></div>';
  const ms=MISSIONS.filter(m=>m.loc===sel).sort((a,b)=>({main:0,side:1,dungeon:2}[a.type]-{main:0,side:1,dungeon:2}[b.type]));
  if(ms.length){h+='<div class="sec">MISSIONS HERE</div>'+ms.map(mcard).join('');}
  else if(!N0.lock)h+='<div class="stat" style="opacity:.7">Nothing to do here yet.</div>';
  const st=STUBS.filter(s=>s[0]===2||s[0]===3);
  h+='<div class="sec">LATER CHAPTERS (LOCKED)</div><div class="card lock">'+STUBS.map(s=>'<div class="stat">&#9643; Act '+['','I','II','III'][s[0]]+': '+s[1]+'</div>').join('')+'</div>';
  showModal(h);
}
function travel(pth,dest){
  // Every world-map leg is now a traversable road. Local terrain changes
  // the enemy deck and scenery; travel-day segments vary by stable hash.
  if(!pth||!pth.length){UI.node=dest;renderBoard();return;}
  const roadAreas=[],dayStart=G.day||1;
  function routeSeed(a,b,day){
    const str=a+'|'+b+'|'+day;
    let h=2166136261;for(let k=0;k<str.length;k++)h=Math.imul(h^str.charCodeAt(k),16777619);
    return h>>>0;
  }
  for(const path of pth){
    const e=path.e,A=NODES[e.a],B=NODES[e.b];
    const ids=e.a+'-'+e.b;
    let terrain='road',reg='green',deck=['bandit','archer','blight'];
    if(/fen|cave/.test(ids)){terrain='marsh';reg='fen';deck=['blight','hound','ashen'];}
    else if(/thorn/.test(ids)){terrain='forest';reg='forest';deck=['blight','bandit','archer'];}
    else if(/mine|ironvale/.test(ids)){terrain='mountain';reg='mine';deck=['bandit','archer','ashen'];}
    else if(/keep/.test(ids)){terrain='ruins';reg='keep';deck=['ashen','bandit','archer'];}
    for(let n=0;n<e.d;n++){
      const seed=routeSeed(ids,String(n),dayStart+roadAreas.length),len=890+(seed%290);
      const pick=(i)=>deck[(seed+i*7+(seed>>>8))%deck.length];
      roadAreas.push({
        id:'travel-'+roadAreas.length,title:e.n+' — day '+(n+1),reg,
        explore:{
          length:len,seed:seed%997,scenery:terrain,
          weather:terrain==='marsh'?'fog':terrain==='mountain'?'snow':terrain==='forest'?(seed%3?'breeze':'rain'):terrain==='ruins'?'wind':seed%7===0?'storm':seed%3===0?'rain':'breeze',
          platforms:[{x:260,w:120,y:-26,kind:'outcrop'},{x:610,w:135,y:-36,kind:'outcrop'}],
          objects:[
            {kind:'chest',label:'ROADSIDE CACHE',x:315,y:-26,slot:'trinket',rarity:1},
            {kind:'exit',label:'CONTINUE JOURNEY',x:len-48,y:0}
          ],
          combatAt:[
            {x:200,list:[{k:pick(0),s:1,d:0},{k:pick(1),s:-1,d:.7}]},
            {x:550,list:[{k:pick(2),s:1,d:0},{k:pick(3),s:-1,d:.8},{k:pick(4),s:1,d:1.6}]}
          ]
        },
        steps:[{t:'explore',goal:'Cross '+e.n+' and reach the next waypoint',intro:[
          N('The road between '+A.n+' and '+B.n+' stretches ahead. On the horizon, the weather and the land are changing.'),
          N('You travel alone. Stay alert for patrols, reavers, beasts and hidden supplies.')
        ]}]
      });
    }
  }
  const m={
    id:'journey-'+dayStart+'-'+dest,type:'travel',act:1,title:'Journey to '+NODES[dest].n,
    reg:'road',lvl:Math.max(1,G.lvl),loc:G.loc,endLoc:dest,
    travelDays:pth.reduce((sum,p)=>sum+p.e.d,0),areas:roadAreas
  };
  MBY[m.id]=m;
  fade(()=>startMission(m.id));
}

  h+='<div class="card"><p style="font-size:13px">'+m.desc+'</p><p>Region: <b>'+REG[m.reg].n+'</b></p><p>Recommended level: <b style="color:'+(G.lvl<m.lvl?'#ff7a6a':'#6fe07a')+'">'+m.lvl+'</b> (you are Lv '+G.lvl+')</p><p>Rewards: ~'+xp+' XP, gold, and loot'+(done?'':', plus story choices that move your compass')+'.</p>'+(done?'<p class="dn">Replay: reduced XP, story choices skipped. Good for farming gear.</p>':'')+'</div>';
  const cp=m.areas&&G.checkpoint&&G.checkpoint.id===id?G.checkpoint:null;
  if(m.areas)h+='<div class="card"><b>'+m.areas.length+' connected battlefields</b> &middot; Multiple objectives &middot; Checkpoint saves'+(cp?'<p>Checkpoint: '+m.areas[cp.area].title+'</p>':'')+'</div>';
  const there=G.loc===m.loc;if(!there)h+='<div class="card"><p class="dn">You are at '+NODES[G.loc].n+'. This mission is at '+NODES[m.loc].n+'. Travel there on the map first.</p></div>';

  showModal(h);
}

function statsHtml(){const m=S.m;return '<div class="card"><div class="stat">HP '+P.max+' &middot; Mana '+P.mmax+' &middot; Defense '+m.def+' &middot; Crit '+m.crit.toFixed(1)+'% (x'+m.critMul+')</div><div class="stat">Damage +'+(m.dmg+m.allDmg)+'% &middot; Sword +'+m.swordDmg+'% &middot; Staff +'+m.staffDmg+'% &middot; Bow +'+m.bowDmg+'%</div><div class="stat">Life leech '+m.leech.toFixed(1)+'% &middot; Regen '+m.regen.toFixed(1)+'/s &middot; Dodge '+m.dodge+'%</div></div>';}
function cellHtml(it,sel,act,v,slot){
  if(!it)return '<div class="cell" style="border-color:#444;color:#666">'+SLOTG[slot]+'<small>empty</small></div>';
  return '<div class="cell'+(sel?' sel':'')+'" data-a="'+act+'" data-v="'+v+'" style="border-color:'+itemCol(it)+';color:'+itemCol(it)+'">'+SLOTG[it.slot]+'<small>'+(it.slot==='outfit'?it.name.slice(0,11):(it.dmg||it.def||'')+' &middot; i'+it.ilvl)+'</small></div>';
}
function itemCard(it,loc){
  const c=itemCol(it),cur=G.eq[it.slot];
  let h='<div class="card" style="border-color:'+c+'"><h4 style="color:'+c+'">'+it.name+'</h4><div class="stat" style="color:'+c+'">'+RAR[it.rar].n+' '+SLOTN[it.slot]+' &middot; item level '+it.ilvl+'</div>';
  for(const l of itemLines(it))h+='<div class="stat">'+l+'</div>';
  if(it.slot==='outfit'){const d=OBY[it.oid];h+='<div style="margin:6px 0">'+[d.col,d.tab,d.trim,d.cape].map(c=>'<span style="display:inline-block;width:18px;height:18px;margin-right:4px;border:1px solid #000;background:'+c+'"></span>').join('')+'</div>';}
  if(loc==='inv'&&cur&&cur.id!==it.id){const k=it.dmg!=null?'dmg':'def',d=(it[k]||0)-(cur[k]||0);if(it[k]!=null)h+='<div class="stat '+(d>=0?'up':'dn')+'">vs equipped: '+(d>=0?'+':'')+d+' '+(k==='dmg'?'damage':'defense')+'</div>';}
  h+='<div class="row" style="display:flex;gap:8px;margin-top:8px">';
  if(loc==='inv')h+='<button class="bt go" data-a="equip" data-v="'+it.id+'" style="flex:1">EQUIP</button><button class="bt" data-a="sell" data-v="'+it.id+'" style="flex:1">SELL '+sellVal(it)+'g</button>';
  else if(it.slot==='outfit')h+='<span class="stat" style="flex:1">Worn</span><button class="bt" data-a="unequip" data-v="outfit" style="flex:1">TAKE OFF</button>';
  else h+='<span class="stat" style="flex:1">Equipped</span>';
  return h+'</div></div>';
}

/* ================= iOS ZOOM GUARD ================= */
/* Safari can ignore user-scalable=no and interpret fast repeated taps as page zoom.
   Keep rapid presses actionable (pointerdown handlers still run), but cancel the
   second synthetic click/tap zoom. Do not interfere with scrolling in menus. */
(function(){
  let previousTap=0,previousX=-1000,previousY=-1000;
  document.addEventListener('touchend',function(e){
    if(document.body.dataset.mode!=='play'||modal.classList.contains('on')||e.touches.length||e.changedTouches.length!==1){
      previousTap=0;return;
    }
    const tap=e.changedTouches[0],now=Date.now();
    const repeat=now-previousTap<380&&Math.abs(tap.clientX-previousX)<36&&Math.abs(tap.clientY-previousY)<36;
    previousTap=now;previousX=tap.clientX;previousY=tap.clientY;
    if(repeat&&e.cancelable)e.preventDefault();
  },{passive:false});
  document.addEventListener('dblclick',function(e){
    if(document.body.dataset.mode==='play'&&!modal.classList.contains('on'))e.preventDefault();
  },{passive:false});
  ['gesturestart','gesturechange'].forEach(function(type){
    document.addEventListener(type,function(e){
      if(document.body.dataset.mode==='play'&&!modal.classList.contains('on'))e.preventDefault();
    },{passive:false});
  });
})();

addEventListener('keydown',e=>{
  if(modal.classList.contains('on')){if(e.key==='Escape'&&S.mode==='play')hideModal();return;}

  if(e.key==='b'||e.key==='B')ACT.bag();if(e.key==='k'||e.key==='K')ACT.skills();if(e.key==='Escape')renderMenu();
});
