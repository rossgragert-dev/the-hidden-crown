name: v0.6.5 Dialogue and Foreground Art Fixes
on:
  push:
    branches: [feature/v065-dialogue-art-polish]
  pull_request:
    branches: [feature/v064-pixel-art-rebuild]
concurrency:
  group: polish-v065-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p /tmp/shots
      - run: npm run build
      - run: git diff --exit-code -- index.html
      - run: npm run test:smoke
      - run: npm run test:boot
      - run: npm run test:polish
      - run: npm run test:opening
      - run: npm run test:pixel-art
      - run: npm run test:world
      - run: npm run test:adventure
      - run: npm run test:quest
      - run: npm run test:zoom
      - run: npm run test:joust
      - run: node tests/lab.js
      - run: node tests/squire.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v065-scene-and-character-screenshots
          path: /tmp/shots/*.png
          if-no-files-found: ignore
