name: iOS Rapid-Tap Zoom Regression
on:
  push:
    branches:
      - development/v0.5.0-living-quests
  pull_request:
    branches:
      - main
concurrency:
  group: ios-zoom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: git diff --exit-code -- index.html
      - run: npm run test:zoom
