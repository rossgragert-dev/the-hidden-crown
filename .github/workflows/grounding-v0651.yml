name: v0.6.5.1 Armory Grounding Hotfix
on:
  push:
    branches: [feature/v0651-armory-grounding]
  pull_request:
    branches: [feature/v065-dialogue-art-polish]
concurrency:
  group: armory-v0651-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p /tmp/shots
      - run: npm run build
      - run: git diff --exit-code -- index.html
      - run: npm run test:grounding
      - run: npm run test:opening
      - run: npm run test:polish
      - run: npm run test:adventure
      - run: npm run test:zoom
      - run: npm run test:joust
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounded-armory-visuals
          path: /tmp/shots/*.png
          if-no-files-found: ignore
